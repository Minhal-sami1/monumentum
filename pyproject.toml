[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monumentum"
version = "0.1.0"
description = "Reference Executor for the Monumentum standard: governed agent self-improvement"
readme = "docs/README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Minhal", email = "miabdulsami@ghaia.ai" }]
dependencies = [
    "jsonschema>=4.21",
    "PyYAML>=6.0",
    "rfc3339-validator>=0.1.4",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "matplotlib>=3.8",
]

[project.scripts]
monumentum = "monumentum.cli:main"
loop = "monumentum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
