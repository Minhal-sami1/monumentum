  - run: [propose, --layer, context, --target, AGENTS.md, --patch, fix.patch,
          --rationale, "Repo uses pnpm.", --producer, claude-code, --id, cs-20260830-c011]
  - run: [evidence, cs-20260830-c011, --record, ev-transcript.json, --artifact, transcript.json]
  - run: [gate, cs-20260830-c011]
  - run: [apply, cs-20260830-c011]
  - run: [verify]
  - edit_file: { path: ".monumentum/journal/*.ndjson", find: "producer/claude-code",
                 replace: "producer/claude-evil" }
