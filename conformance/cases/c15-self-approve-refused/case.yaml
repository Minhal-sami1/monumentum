description: the producer identity cannot approve its own ChangeSet (Section 11 of GOAL, I3 spirit)
steps:
  - run: [init]
  - run: [propose, --layer, capability, --target, tools/helper.py, --patch, cap.patch,
          --rationale, "helper uses a removed flag", --producer, claude-code,
          --id, cs-20260830-c015]
  - run: [evidence, cs-20260830-c015, --record, ev-human.json]
  - run: [gate, cs-20260830-c015]
    expect_exit: 2
  - run: [approve, cs-20260830-c015, --actor, reviewer/claude-code]
    expect_exit: 1
  - expect_file: { path: tools/helper.py, equals: "print('v1')\n" }
expected_events: [genesis, proposed, gated]
