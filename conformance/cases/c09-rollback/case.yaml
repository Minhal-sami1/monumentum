description: one command restores the exact pre-apply content (invariant I5, A5)
steps:
  - run: [init]
  - run: [propose, --layer, context, --target, AGENTS.md, --patch, fix.patch,
          --rationale, "Repo uses pnpm.", --producer, claude-code, --id, cs-20260830-c009]
  - run: [evidence, cs-20260830-c009, --record, ev-transcript.json, --artifact, transcript.json]
  - run: [gate, cs-20260830-c009]
  - run: [apply, cs-20260830-c009]
  - expect_file: { path: AGENTS.md, contains: pnpm }
  - run: [rollback, cs-20260830-c009, --actor, human/operator]
  - expect_file: { path: AGENTS.md, equals: "# Agent notes\n\nUse npm install to set up.\n" }
expected_events: [genesis, proposed, gated, applied, rolled_back]
