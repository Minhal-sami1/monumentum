# Smallest conformant policy: three classes, protected .monumentum/**, no optional blocks.
spec: monumentum/v0.1
envelope:
  context:
    level: L0
    gates: []
    targets_allow: ["AGENTS.md"]
  capability:
    level: L0
    gates: []
    targets_allow: ["tools/**"]
  architecture:
    level: L0
    gates: []
    targets_allow: ["agents.yaml"]
protected: [".monumentum/**"]
