[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monumentum-sdk"
version = "0.1.0"
description = "Python SDK for the Monumentum standard: embed governed self-improvement in a custom agent"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["monumentum"]

[tool.setuptools]
packages = ["monumentum_sdk"]
