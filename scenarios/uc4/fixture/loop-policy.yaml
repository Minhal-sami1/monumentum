# UC4 policy: capability runs at L2 so plausible-but-bad changes auto-apply
# and the de-escalation ratchet is what catches the pattern.
spec: loop/v0.1
envelope:
  context:
    level: L2
    gates: [evidence_required, reproducible_check]
    targets_allow: ["AGENTS.md"]
  capability:
    level: L2
    gates: [evidence_required]
    targets_allow: ["tools/**"]
  architecture:
    level: L1
    gates: [evidence_required, human_review]
    targets_allow: ["agents.yaml"]
protected: [".loop/**"]
de_escalation: { on_rollbacks: 2, window_days: 14, drop: 1 }
audit: { journal: hash-chain, retain_days: 365 }
